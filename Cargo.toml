[package]
name = "mtb"
version = "0.1.0"
edition = "2021"
default-run = "mtb"

[dependencies]
polymarket-client-sdk = { git = "https://github.com/Polymarket/rs-clob-client", features = [
    "clob",
    "ws",
    "rtds",
    "gamma",
    "data",
    "heartbeats",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
rust_decimal = { version = "1.40", features = ["serde"] }
rust_decimal_macros = "1.40"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
alloy = { version = "1.6", default-features = false, features = ["signers", "signer-local"] }
futures = "0.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
teloxide = { version = "0.13", features = ["macros"], optional = true }
prometheus = { version = "0.13", optional = true }
axum = { version = "0.8", optional = true }
async-trait = "0.1.89"

[features]
default = ["telegram"]
telegram = ["dep:teloxide"]
metrics = ["dep:prometheus", "dep:axum"]
